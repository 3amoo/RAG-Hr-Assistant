# Alembic configuration used inside the Docker image.
#
# The migration directory lives next to this file, and env.py derives the
# database URL from the application settings (environment variables).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/../../..
version_path_separator = os

# The URL below is only a placeholder. env.py replaces it with the value built
# from POSTGRES_* settings before running any migration.
sqlalchemy.url = postgresql+psycopg2://CHANGE_ME_USER:CHANGE_ME_PASS@localhost:5432/minihr

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
