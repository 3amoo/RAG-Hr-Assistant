# Alembic configuration for local development.
#
# Usage (from the repository root):
#   alembic -c src/models/db_schemes/mini_hr/alembic.ini upgrade head
#
# env.py builds the database URL from src/.env or the process environment.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/../../..
version_path_separator = os

sqlalchemy.url = postgresql+psycopg2://CHANGE_ME_USER:CHANGE_ME_PASS@localhost:5432/minihr

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
